  <body>
    <div

    <script>
    (function() {
      function patchSite() {
        // Wait for the donate section to exist (means React has rendered)
        var donateSection = document.getElementById('donate');

        var regSection = document.createElement('section');

        regSection.style.background = 'linear-gradient(135deg, var(--purple-50) 0%, var(--orange-50) 50%, var(--teal-50) 100%)';
        regSection.innerHTML = '' +
          '<div class="max-w-xl mx-auto">' +
            '<div class="text-center mb-10">' +
              '<div class="inline-flex items-center gap-1.5 text-sm font-bold uppercase tracking-wider" style="color:var(--accent)">' +
                '<img src="assets/logo.png" alt="SparkMath logo" width="24" height="24" class="inline-block" style="object-fit:contain" />' +
                ' Get Involved' +
              '</div>' +
              '<h2 class="text-2xl sm:text-3xl font-extrabold mt-3">' +
                'Register for the <span style="color:var(--gold)">2026\u20132027</span> school year' +
              '</h2>' +
              '<p class="text-sm mt-2" style="color:var(--dim)">Join our free weekly math club for grades 4\u20136!</p>' +
            '</div>' +
            '<div class="rounded-2xl p-6 sm:p-8 text-center" style="background:var(--bg);border:1px solid var(--border)">' +
              '<div class="text-4xl mb-4">\u2728</div>' +
              '<h3 class="text-xl font-extrabold" style="color:var(--accent)">Ready to join SparkMath?</h3>' +
              '<p class="text-sm mt-2 mb-6 max-w-sm mx-auto" style="color:var(--dim)">' +
                'Register through the New Providence Library calendar. Registration is required and covers all sessions for the season.' +
              '</p>' +
              '<div class="space-y-3">' +
                '<a href="https://newprovidence.librarycalendar.com/event/teens-teaching-math-club-7201" target="_blank" rel="noopener" ' +
                  'class="inline-flex items-center gap-2 rounded-full px-8 py-3 text-base font-bold text-white shadow-lg transition-transform hover:scale-105" ' +
                  'style="background:linear-gradient(135deg,#9E7676,#7A5A5A)">' +
                  'Register Now \u2192' +
                '</a>' +
              '</div>' +
              '<div class="mt-6 grid sm:grid-cols-2 gap-3 text-left">' +
                '<div class="flex items-start gap-3 rounded-xl px-4 py-3" style="border-left:3px solid var(--gold);background:var(--surface)">' +
                  '<span class="text-xl mt-0.5">\uD83D\uDCC5</span>' +
                  '<div><div class="text-xs font-bold uppercase" style="color:var(--dim)">When</div><div class="text-sm font-semibold mt-0.5">2nd and 4th Sundays, 3:30 \u2013 4:30 PM</div></div>' +
                '</div>' +
                '<div class="flex items-start gap-3 rounded-xl px-4 py-3" style="border-left:3px solid var(--gold);background:var(--surface)">' +
                  '<span class="text-xl mt-0.5">\uD83D\uDCCD</span>' +
                  '<div><div class="text-xs font-bold uppercase" style="color:var(--dim)">Where</div><div class="text-sm font-semibold mt-0.5">New Providence Library, NJ</div></div>' +
                '</div>' +
              '</div>' +
            '</div>' +
          '</div>';
        donateSection.parentNode.insertBefore(regSection, donateSection);

        // 2. Add "Register" link to the nav bar
        var navLinks = document.querySelector('nav .hidden.sm\\:flex');
        if (navLinks) {
          // Find the last donate button and add Register before it
          var links = navLinks.querySelectorAll('a');
          var lastLink = links[links.length - 1];
          var regLink = document.createElement('a');
          regLink.href = '#register';
          regLink.className = 'hover:text-[var(--accent)] transition-colors rounded-full px-4 py-1.5 text-white';
          regLink.style.background = 'var(--accent)';
          regLink.textContent = 'Register';
          var storiesLink = document.createElement('a');
          storiesLink.href = '#testimonials';
          storiesLink.className = 'hover:text-[var(--accent)] transition-colors';
          storiesLink.textContent = 'Stories';
          var learnedLink = document.createElement('a');
          learnedLink.href = '#learned';
          learnedLink.className = 'hover:text-[var(--accent)] transition-colors';
          learnedLink.textContent = 'Learned';
          var faqLink = document.createElement('a');
          faqLink.href = '#faq';
          faqLink.className = 'hover:text-[var(--accent)] transition-colors';
          faqLink.textContent = 'FAQ';
          navLinks.insertBefore(learnedLink, regLink);
          navLinks.insertBefore(faqLink, regLink);
          navLinks.insertBefore(storiesLink, regLink);
          navLinks.insertBefore(regLink, lastLink);
        }

        // 6. Testimonials section at the end, after Donate
        var testSection = document.createElement('section');
        testSection.id = 'testimonials';
        testSection.className = 'py-16 sm:py-24 px-5';
        testSection.style.background = 'var(--surface)';
        testSection.innerHTML = '' +
          '<div class="max-w-3xl mx-auto">' +
            '<div class="text-center mb-10">' +
              '<div class="inline-flex items-center gap-1.5 text-sm font-bold uppercase tracking-wider" style="color:var(--accent)">' +
                '<img src="assets/logo.png" alt="SparkMath logo" width="24" height="24" class="inline-block" style="object-fit:contain" />' +
                ' Testimonials' +
              '</div>' +
              '<h2 class="text-2xl sm:text-3xl font-extrabold mt-3">What families say about <span style="color:var(--gold)">SparkMath</span></h2>' +
              '<p class="text-sm mt-2" style="color:var(--dim)">Parents and students share how SparkMath helped them.</p>' +
            '</div>' +
            '<div id="stories-list" class="grid sm:grid-cols-2 gap-4 mb-10"></div>' +
            '<div class="rounded-2xl p-6 sm:p-8" style="background:var(--bg);border:1px solid var(--border)">' +
              '<h3 class="text-xl font-extrabold">Share your story</h3>' +
              '<p class="text-sm mt-1 mb-5" style="color:var(--dim)">Are you a parent or a student? Tell us how SparkMath helped. Stories appear here after the team reviews them.</p>' +
              '<form id="story-form" class="space-y-4">' +
                '<div><label class="block text-sm font-bold mb-1.5">Your name *</label>' +
                '<input required name="story-name" type="text" placeholder="Your name" class="w-full rounded-xl px-4 py-2.5 text-base outline-none" style="background:var(--surface);border:1px solid var(--border)" /></div>' +
                '<div><label class="block text-sm font-bold mb-1.5">I am a *</label>' +
                '<select required name="story-role" class="w-full rounded-xl px-4 py-2.5 text-base outline-none" style="background:var(--surface);border:1px solid var(--border)"><option value="" disabled selected>Choose one</option><option>Parent</option><option>Student</option><option>Other</option></select></div>' +
                '<div><label class="block text-sm font-bold mb-1.5">Your story *</label>' +
                '<textarea required name="story-text" rows="4" placeholder="How has SparkMath helped you or your child?" class="w-full rounded-xl px-4 py-2.5 text-base outline-none" style="background:var(--surface);border:1px solid var(--border)"></textarea></div>' +
                '<button type="submit" class="w-full rounded-full py-3 text-base font-bold text-white shadow-lg transition-transform hover:scale-[1.02]" style="background:linear-gradient(135deg,#9E7676,#7A5A5A)">Share your story</button>' +
                '<p id="story-done" class="hidden text-sm font-semibold text-center" style="color:var(--accent)">Thank you! Your story was sent to the SparkMath team and will appear here after review.</p>' +
              '</form>' +
            '</div>' +
          '</div>';
        donateSection.parentNode.insertBefore(testSection, donateSection.nextSibling);

        // Render stories saved on this device, marked pending review
        var escapeHtml = function(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');};
        var renderStories = function(){
          var list = document.getElementById('stories-list');
          if(!list) return;
          var saved = [];
          try { saved = JSON.parse(localStorage.getItem('sparkmath-stories') || '[]'); } catch(e) { saved = []; }
          if(!saved.length){
            list.innerHTML = '<div class="sm:col-span-2 rounded-2xl p-6 text-center" style="background:var(--bg);border:1px solid var(--border)"><div class="text-3xl mb-2">\u2728</div><p class="font-bold">No stories yet \u2014 be the first to share yours!</p><p class="text-sm mt-1" style="color:var(--dim)">Your story could help another family discover SparkMath.</p></div>';
            return;
          }
          list.innerHTML = saved.map(function(s){
            return '<div class="rounded-2xl p-5" style="background:var(--bg);border:1px solid var(--border)"><p class="text-[15px] leading-7" style="color:var(--dim)">\u201C' + escapeHtml(s.text) + '\u201D</p><div class="mt-3 text-sm font-bold">' + escapeHtml(s.name) + ' <span class="font-semibold" style="color:var(--dim)">\u00B7 ' + escapeHtml(s.role) + '</span></div><div class="mt-1"><span class="inline-block text-[11px] font-bold uppercase tracking-widest px-2.5 py-0.5 rounded-full" style="background:var(--gold-50);color:var(--gold)">Pending review</span></div></div>';
          }).join('');
        };
        renderStories();
        var storyForm = document.getElementById('story-form');
        if(storyForm){
          storyForm.addEventListener('submit', function(e){
            e.preventDefault();
            var name = storyForm.elements['story-name'].value.trim();
            var role = storyForm.elements['story-role'].value;
            var text = storyForm.elements['story-text'].value.trim();
            if(!name || !role || !text) return;
            var saved = [];
            try { saved = JSON.parse(localStorage.getItem('sparkmath-stories') || '[]'); } catch(err) { saved = []; }
            saved.unshift({name:name, role:role, text:text});
            try { localStorage.setItem('sparkmath-stories', JSON.stringify(saved)); } catch(err) {}
            renderStories();
            var done = document.getElementById('story-done');
            if(done) done.classList.remove('hidden');
            storyForm.reset();
            window.location.href = 'mailto:sparkmathproject@gmail.com?subject=' + encodeURIComponent('SparkMath testimonial from ' + name) + '&body=' + encodeURIComponent('Name: ' + name + '\nI am a: ' + role + '\n\n' + text);
          });
        }

        // 3. Fix "New Providence Memorial Library" -> "New Providence Library"
        var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
        while (walker.nextNode()) {
          if (walker.currentNode.nodeValue.indexOf('New Providence Memorial Library') !== -1) {
            walker.currentNode.nodeValue = walker.currentNode.nodeValue.replace(/New Providence Memorial Library/g, 'New Providence Library');
          }
        }

        // 4. Fix contact email in footer
        var footerDivs = document.querySelectorAll('footer div');
        footerDivs.forEach(function(el) {
          if (el.childNodes.length === 1 && el.textContent.indexOf('contact@mathsparkproject.org') !== -1) {
            el.textContent = '\u2709\uFE0F sparkmathproject@gmail.com';
          }
        });

        // 5. Update hero "Support Us" button to "Join Us" linking to register
        var heroLinks = document.querySelectorAll('a[href="#donate"]');
        heroLinks.forEach(function(el) {
          if (el.textContent.trim().indexOf('Support Us') !== -1) {
            el.href = '#register';
            el.innerHTML = 'Join Us <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
          }
        });


        // 7. Next session countdown, before the Schedule section
        var schedSection = document.getElementById('schedule');
        if (schedSection) {
          var cdSection = document.createElement('section');
          cdSection.id = 'countdown';
          cdSection.className = 'py-12 sm:py-16 px-5';
          cdSection.innerHTML = '' +
            '<div class="max-w-3xl mx-auto text-center">' +
              '<div class="inline-flex items-center gap-1.5 text-sm font-bold uppercase tracking-wider" style="color:var(--accent)">' +
                '<img src="assets/logo.png" alt="SparkMath logo" width="24" height="24" class="inline-block" style="object-fit:contain" />' +
                ' Next Session' +
              '</div>' +
              '<h2 class="text-2xl sm:text-3xl font-extrabold mt-3">See you at the <span style="color:var(--gold)">next session</span></h2>' +
              '<p id="countdown-date" class="text-base font-semibold mt-3" style="color:var(--dim)"></p>' +
              '<div class="mt-6 flex justify-center gap-3 sm:gap-4">' +
                '<div class="rounded-2xl px-4 py-3 w-20" style="background:var(--surface);border:1px solid var(--border)"><div id="cd-days" class="text-2xl sm:text-3xl font-extrabold" style="color:var(--gold)">--</div><div class="text-xs font-bold uppercase mt-1" style="color:var(--dim)">Days</div></div>' +
                '<div class="rounded-2xl px-4 py-3 w-20" style="background:var(--surface);border:1px solid var(--border)"><div id="cd-hours" class="text-2xl sm:text-3xl font-extrabold" style="color:var(--gold)">--</div><div class="text-xs font-bold uppercase mt-1" style="color:var(--dim)">Hours</div></div>' +
                '<div class="rounded-2xl px-4 py-3 w-20" style="background:var(--surface);border:1px solid var(--border)"><div id="cd-mins" class="text-2xl sm:text-3xl font-extrabold" style="color:var(--gold)">--</div><div class="text-xs font-bold uppercase mt-1" style="color:var(--dim)">Minutes</div></div>' +
              '</div>' +
              '<p class="text-sm mt-4" style="color:var(--dim)">2nd and 4th Sundays, 3:30 to 4:30 PM at New Providence Library.</p>' +
              '<a href="#register" class="mt-5 inline-flex items-center gap-2 rounded-full px-7 py-3 text-base font-bold text-white shadow-lg transition-transform hover:scale-105" style="background:linear-gradient(135deg, var(--accent), #7A5A5A)">Register for the next session</a>' +
            '</div>';
          schedSection.parentNode.insertBefore(cdSection, schedSection);
          var updateCountdown = function(){
            var now = new Date();
            var next = null;
            for (var m = 0; m < 4 && !next; m++) {
              var base = new Date(now.getFullYear(), now.getMonth() + m, 1);
              var firstDow = base.getDay();
              var firstSun = 1 + ((7 - firstDow) % 7);
              [firstSun + 7, firstSun + 21].forEach(function(day){
                if (next) return;
                var d = new Date(base.getFullYear(), base.getMonth(), day, 15, 30, 0);
                if (d.getTime() > now.getTime()) next = d;
              });
            }
            if (!next) return;
            var dateEl = document.getElementById('countdown-date');
            if (dateEl) dateEl.textContent = 'Sunday, ' + next.toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'}) + ', 3:30 to 4:30 PM';
            var diff = next.getTime() - now.getTime();
            var set = function(id, v){ var el = document.getElementById(id); if (el) el.textContent = v; };
            set('cd-days', Math.floor(diff / 86400000));
            set('cd-hours', Math.floor(diff % 86400000 / 3600000));
            set('cd-mins', Math.floor(diff % 3600000 / 60000));
          };
          updateCountdown();
          setInterval(updateCountdown, 60000);
        }

        // 8. What We Learned This Week, before the Register section
        var learnedSection = document.createElement('section');
        learnedSection.id = 'learned';
        learnedSection.className = 'py-16 sm:py-24 px-5';
        learnedSection.style.background = 'var(--surface)';
        learnedSection.innerHTML = '' +
          '<div class="max-w-3xl mx-auto">' +
            '<div class="text-center mb-10">' +
              '<div class="inline-flex items-center gap-1.5 text-sm font-bold uppercase tracking-wider" style="color:var(--accent)">' +
                '<img src="assets/logo.png" alt="SparkMath logo" width="24" height="24" class="inline-block" style="object-fit:contain" />' +
                ' What We Learned' +
              '</div>' +
              '<h2 class="text-2xl sm:text-3xl font-extrabold mt-3">What we learned <span style="color:var(--gold)">this week</span></h2>' +
              '<p class="text-sm mt-2" style="color:var(--dim)">A short recap after each session, so families can see what the kids practiced.</p>' +
            '</div>' +
            '<div class="space-y-6">' +
              '<article class="rounded-2xl p-6 sm:p-8" style="background:var(--bg);border:1px solid var(--border)">' +
                '<span class="inline-block text-[11px] font-bold uppercase tracking-widest px-2.5 py-0.5 rounded-full" style="background:var(--gold-50);color:var(--gold)">November 8, 2026</span>' +
                '<h3 class="text-xl font-extrabold mt-2">Variables</h3>' +
                '<p class="text-[15px] leading-7 mt-2" style="color:var(--dim)">This week we learned about variables, the letters that stand for numbers we do not know yet. Students practiced finding the missing number in equations like x + 7 = 9 and 2x + 10 = 20, and by the end they could solve for x and y on their own.</p>' +
                '<div class="mt-4 flex flex-wrap gap-2">' +
                  '<span class="rounded-full px-3 py-1 text-sm font-bold" style="background:var(--gold-50);color:var(--gold);border:1px solid var(--gold)">x + 7 = 9, so x = 2</span>' +
                  '<span class="rounded-full px-3 py-1 text-sm font-bold" style="background:var(--gold-50);color:var(--gold);border:1px solid var(--gold)">2x = 8, so x = 4</span>' +
                  '<span class="rounded-full px-3 py-1 text-sm font-bold" style="background:var(--gold-50);color:var(--gold);border:1px solid var(--gold)">2x + 10 = 20, so x = 5</span>' +
                  '<span class="rounded-full px-3 py-1 text-sm font-bold" style="background:var(--gold-50);color:var(--gold);border:1px solid var(--gold)">3y + 1 = 4, so y = 1</span>' +
                '</div>' +
              '</article>' +
              '<article class="rounded-2xl p-6 sm:p-8" style="background:var(--bg);border:1px solid var(--border)">' +
                '<span class="inline-block text-[11px] font-bold uppercase tracking-widest px-2.5 py-0.5 rounded-full" style="background:var(--gold-50);color:var(--gold)">October 25, 2026</span>' +
                '<h3 class="text-xl font-extrabold mt-2">Equations and Word Problems</h3>' +
                '<p class="text-[15px] leading-7 mt-2" style="color:var(--dim)">We reviewed variables, equations, and expressions, starting with x + 2 = 5, so x = 3. Students practiced solving basic equations, then tried word problems, stories that turn into equations. For example, Bobcat and Bobbycat eat 12 pounds of food a day, and Bobcat eats twice as much as Bobbycat, so Bobbycat eats 4 pounds a day. One apple makes 8 slices and feeds Robertio the mouse for 4 days, so he eats 2 slices a day.</p>' +
                '<div class="mt-4 flex flex-wrap gap-2">' +
                  '<span class="rounded-full px-3 py-1 text-sm font-bold" style="background:var(--gold-50);color:var(--gold);border:1px solid var(--gold)">x + 2 = 5, so x = 3</span>' +
                  '<span class="rounded-full px-3 py-1 text-sm font-bold" style="background:var(--gold-50);color:var(--gold);border:1px solid var(--gold)">Bobbycat eats 4 pounds a day</span>' +
                  '<span class="rounded-full px-3 py-1 text-sm font-bold" style="background:var(--gold-50);color:var(--gold);border:1px solid var(--gold)">Robertio eats 2 slices a day</span>' +
                '</div>' +
              '</article>' +
            '</div>' +
            '<p class="text-sm text-center mt-6" style="color:var(--dim)">New entries will be added here after each session.</p>' +
          '</div>';
        donateSection.parentNode.insertBefore(learnedSection, regSection);

        // 9. Parent FAQ, before the Register section
        var faqSection = document.createElement('section');
        faqSection.id = 'faq';
        faqSection.className = 'py-16 sm:py-24 px-5';
        faqSection.innerHTML = '' +
          '<div class="max-w-3xl mx-auto">' +
            '<div class="text-center mb-10">' +
              '<div class="inline-flex items-center gap-1.5 text-sm font-bold uppercase tracking-wider" style="color:var(--accent)">' +
                '<img src="assets/logo.png" alt="SparkMath logo" width="24" height="24" class="inline-block" style="object-fit:contain" />' +
                ' For Parents' +
              '</div>' +
              '<h2 class="text-2xl sm:text-3xl font-extrabold mt-3">Questions parents <span style="color:var(--gold)">ask us</span></h2>' +
            '</div>' +
            '<div class="space-y-3">' +
              '<details class="rounded-2xl p-5" style="background:var(--surface);border:1px solid var(--border)"><summary class="font-bold cursor-pointer">Is SparkMath free?</summary><p class="text-[15px] leading-7 mt-2" style="color:var(--dim)">Yes. Every session is completely free.</p></details>' +
              '<details class="rounded-2xl p-5" style="background:var(--surface);border:1px solid var(--border)"><summary class="font-bold cursor-pointer">What grades is it for?</summary><p class="text-[15px] leading-7 mt-2" style="color:var(--dim)">SparkMath is for students in 4th to 6th grade.</p></details>' +
              '<details class="rounded-2xl p-5" style="background:var(--surface);border:1px solid var(--border)"><summary class="font-bold cursor-pointer">When and where does it meet?</summary><p class="text-[15px] leading-7 mt-2" style="color:var(--dim)">We meet on the 2nd and 4th Sundays of the month, 3:30 to 4:30 PM, at New Providence Library in New Jersey.</p></details>' +
              '<details class="rounded-2xl p-5" style="background:var(--surface);border:1px solid var(--border)"><summary class="font-bold cursor-pointer">Does my child need to know anything first?</summary><p class="text-[15px] leading-7 mt-2" style="color:var(--dim)">No. There are no prerequisites. The material is at a high 5th grade level, and we explain every new idea from the start.</p></details>' +
              '<details class="rounded-2xl p-5" style="background:var(--surface);border:1px solid var(--border)"><summary class="font-bold cursor-pointer">How do we sign up?</summary><p class="text-[15px] leading-7 mt-2" style="color:var(--dim)">Register through the SparkMath registration form: <a href="https://forms.gle/eW95bLzfteL2mB9VA" target="_blank" rel="noopener" style="color:var(--accent);font-weight:700">SparkMath registration form</a>. You can also register on the New Providence Library calendar.</p></details>' +
              '<details class="rounded-2xl p-5" style="background:var(--surface);border:1px solid var(--border)"><summary class="font-bold cursor-pointer">What should my child bring?</summary><p class="text-[15px] leading-7 mt-2" style="color:var(--dim)">Just a pencil and paper. Nothing else is needed.</p></details>' +
            '</div>' +
          '</div>';
        donateSection.parentNode.insertBefore(faqSection, regSection);

        // 10. Summer bootcamp coming soon banner, before the Mission section
        var missionSection = document.getElementById('mission');
        if (missionSection) {
          var bootBanner = document.createElement('div');
          bootBanner.className = 'px-5 py-4 text-center';
          bootBanner.style.background = 'var(--gold-50)';
          bootBanner.style.borderBottom = '1px solid var(--gold)';
          bootBanner.innerHTML = '<p class="text-sm sm:text-base font-bold" style="color:var(--gold)">Coming soon: look out for a bootcamp in the summer. Details will be shared here.</p>';
          missionSection.parentNode.insertBefore(bootBanner, missionSection);
        }

        return true;
      }

      // Poll until React has rendered
      var attempts = 0;
      var timer = setInterval(function() {
        attempts++;
        if (patchSite() || attempts > 60) {
          clearInterval(timer);
        }
      }, 250);
    })();
    </script>
  </body>
</html>
